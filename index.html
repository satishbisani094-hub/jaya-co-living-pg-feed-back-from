<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaya Co Living PG Feedback Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            resize: vertical;
        }

        .rating {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            width: 100%;
            background: #007bff;
            color: white;
            padding: 12px;
            border: none;
            margin-top: 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }

        .success {
            text-align: center;
            color: green;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Jaya Co Living PG Feedback Form</h2>

        <form id="feedbackForm">
            <label>Full Name</label>
            <input type="text" required>

            <label>Mobile Number</label>
            <input type="tel" required>

            <label>Room Number</label>
            <input type="text">

            <label>Duration of Stay</label>
            <select required>
                <option value="">Select</option>
                <option>Less than 1 Month</option>
                <option>1-3 Months</option>
                <option>3-6 Months</option>
                <option>6-12 Months</option>
                <option>More than 1 Year</option>
            </select>

            <label>Room Cleanliness</label>
            <select required>
                <option value="">Rate</option>
                <option>⭐ 1</option>
                <option>⭐⭐ 2</option>
                <option>⭐⭐⭐ 3</option>
                <option>⭐⭐⭐⭐ 4</option>
                <option>⭐⭐⭐⭐⭐ 5</option>
            </select>

            <label>Food Quality</label>
            <select required>
                <option value="">Rate</option>
                <option>⭐ 1</option>
                <option>⭐⭐ 2</option>
                <option>⭐⭐⭐ 3</option>
                <option>⭐⭐⭐⭐ 4</option>
                <option>⭐⭐⭐⭐⭐ 5</option>
            </select>

            <label>Wi-Fi Quality</label>
            <select required>
                <option value="">Rate</option>
                <option>⭐ 1</option>
                <option>⭐⭐ 2</option>
                <option>⭐⭐⭐ 3</option>
                <option>⭐⭐⭐⭐ 4</option>
                <option>⭐⭐⭐⭐⭐ 5</option>
            </select>

            <label>Security & Safety</label>
            <select required>
                <option value="">Rate</option>
                <option>⭐ 1</option>
                <option>⭐⭐ 2</option>
                <option>⭐⭐⭐ 3</option>
                <option>⭐⭐⭐⭐ 4</option>
                <option>⭐⭐⭐⭐⭐ 5</option>
            </select>

            <label>What did you like most about our PG?</label>
            <textarea rows="4"></textarea>

            <label>Suggestions for Improvement</label>
            <textarea rows="4"></textarea>

            <label>Your Review</label>
            <textarea rows="5" placeholder="Write your review here..." required></textarea>

            <label>Would you recommend this PG to others?</label>
            <select required>
                <option value="">Select</option>
                <option>Yes</option>
                <option>Maybe</option>
                <option>No</option>
            </select>

            <label>Overall Rating (1-10)</label>
            <input type="number" min="1" max="10" required>

            <button type="submit">Submit Feedback</button>
        </form>

        <p class="success" id="message"></p>
    </div>

<script>
  // 👉 Replace with your Apps‑Script Web‑App URL
  const APP_SCRIPT_URL = "YOUR_APPS_SCRIPT_URL_HERE";

  document.getElementById("feedbackForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const f = e.target;
    const data = {
      fullName: f.querySelector('input[type="text"][required]').value,
      mobileNumber: f.querySelector('input[type="tel"][required]').value,
      roomNumber: f.querySelectorAll('input[type="text"]')[1].value,
      stayDuration: f.querySelector('select[required]').value,
      cleanliness: f.querySelectorAll('select[required]')[1].value,
      foodQuality: f.querySelectorAll('select[required]')[2].value,
      wifiQuality: f.querySelectorAll('select[required]')[3].value,
      safety: f.querySelectorAll('select[required]')[4].value,
      likes: f.querySelectorAll('textarea')[0].value,
      suggestions: f.querySelectorAll('textarea')[1].value,
      reviewText: f.querySelectorAll('textarea')[2].value,
      recommend: f.querySelectorAll('select[required]')[5].value,
      overallRating: f.querySelector('input[type="number"][required]').value
    };
    try {
      await fetch(APP_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
    } catch (err) {
      console.error(err);
    }
    // Build mailto URL with feedback data
    const emailBody = encodeURIComponent(
      `New feedback from ${data.fullName}:\n` +
      `Mobile: ${data.mobileNumber}\n` +
      `Room: ${data.roomNumber}\n` +
      `Stay: ${data.stayDuration}\n` +
      `Cleanliness: ${data.cleanliness}\n` +
      `Food: ${data.foodQuality}\n` +
      `Wi‑Fi: ${data.wifiQuality}\n` +
      `Safety: ${data.safety}\n` +
      `Likes: ${data.likes}\n` +
      `Suggestions: ${data.suggestions}\n` +
      `Review: ${data.reviewText}\n` +
      `Recommend: ${data.recommend}\n` +
      `Overall rating: ${data.overallRating}`
    );
    const mailtoLink = `mailto:msrdy@7gmail.com?subject=New%20Jaya%20Co%20Living%20Feedback&body=${emailBody}`;
    window.location.href = mailtoLink;

    document.getElementById("message").innerText = "Thank you for your valuable feedback!";
    f.reset();
  });
</script>

</body>

</html>
